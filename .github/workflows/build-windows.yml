name: Windows 프로그램 빌드

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 구성요소 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 코드 검사
        run: ruff check stele_extractor tests --select F,E9

      - name: 시험 (한국어 OCR 포함)
        env:
          QT_QPA_PLATFORM: offscreen
          STELE_NO_3D: "1"
          TEST_KOREAN_OCR: "1"
        run: python -m pytest -v

      - name: 실행 파일 만들기
        run: pyinstaller --noconfirm SteleExtractor.spec

      - name: 실행 파일 자체 시험
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\selftest.log"
          $p = Start-Process -FilePath "dist\SteleExtractor\SteleExtractor.exe" `
               -ArgumentList "--selftest", "--selftest-log=$log" -Wait -PassThru
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }

      - name: 배포 묶음 만들기
        shell: pwsh
        run: |
          Copy-Item README.md "dist\SteleExtractor\사용설명서.md"
          Compress-Archive -Path "dist\SteleExtractor" -DestinationPath "SteleExtractor-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SteleExtractor-windows
          path: SteleExtractor-windows.zip
          retention-days: 30

      - name: 릴리스에 올리기 (v로 시작하는 태그일 때)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SteleExtractor-windows.zip
